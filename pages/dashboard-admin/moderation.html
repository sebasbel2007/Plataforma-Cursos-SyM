<!DOCTYPE html>
<!-- File: plataforma cursos SyM/pages/dashboard-admin/moderation.html -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderación — Cursos SyM</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    /* Sidebar Navigation */
    .sidebar-nav {
      padding: .75rem 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: .875rem;
      padding: .625rem 1rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      margin: 0 .5rem;
      transition: all .15s ease;
    }
    .sidebar-link:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .sidebar-link.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .sidebar-link-secondary {
      color: var(--text-muted);
      font-size: .8125rem;
    }
    .sidebar-icon {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }
    .sidebar-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-badge {
      background: var(--error);
      color: #fff;
      font-size: .625rem;
      font-weight: 700;
      padding: .125rem .5rem;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }
    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: .5rem 1rem;
    }
  </style>
</head>
<body>

<div class="app-layout">

  <div class="main-content">
    <div class="page-content">

      <div style="margin-bottom:2rem;">
        <h2 style="margin-bottom:.25rem;">Moderación</h2>
        <p style="font-size:.875rem;color:var(--text-muted);">Cola de revisión de solicitudes y contenidos que no son cursos.</p>
      </div>

      <div class="card" style="padding:2rem;max-width:640px;">
        <div style="display:flex;align-items:center;gap:.875rem;margin-bottom:1rem;">
          <div style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <div>
            <h3 style="font-size:1rem;margin-bottom:.25rem;">No hay solicitudes para revisar</h3>
            <p style="font-size:.8125rem;color:var(--text-muted);">La revisión de cursos (aprobar, rechazar, archivar, eliminar) se hace desde la sección <strong>Cursos</strong>.</p>
          </div>
        </div>
        <a href="courses.html" class="btn btn-primary btn-sm">Ir a Cursos</a>
      </div>

    </div>
  </div>
</div>

<script type="module" src="../../assets/js/app.js"></script>
<script type="module" src="../../assets/js/admin-utils.js"></script>
<script type="module" src="../../assets/js/moderation.js"></script>
<script type="module" src="../../assets/js/spa.js"></script>
</body>
</html>
