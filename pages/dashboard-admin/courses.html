<!DOCTYPE html>
<!-- File: plataforma cursos SyM/pages/dashboard-admin/courses.html -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursos — Cursos SyM</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    /* Sidebar Navigation */
    .sidebar-nav {
      padding: .75rem 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: .875rem;
      padding: .625rem 1rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      margin: 0 .5rem;
      transition: all .15s ease;
    }
    .sidebar-link:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .sidebar-link.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .sidebar-link-secondary {
      color: var(--text-muted);
      font-size: .8125rem;
    }
    .sidebar-icon {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }
    .sidebar-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-badge {
      background: var(--error);
      color: #fff;
      font-size: .625rem;
      font-weight: 700;
      padding: .125rem .5rem;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }
    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: .5rem 1rem;
    }
    .tab-btn {
      padding: .625rem 1.25rem;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s;
    }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>

<div class="app-layout">

  <div class="main-content">
    <div class="page-content">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <div>
          <h2 style="margin-bottom:.25rem;">Gestión de cursos</h2>
          <p id="courses-count-msg" style="font-size:.875rem;color:var(--text-muted);"></p>
        </div>
        <button id="btn-delete-requests" class="btn btn-ghost btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="margin-right:.375rem;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          Solicitudes de eliminación <span id="requests-badge" class="hidden" style="background:var(--error);color:#fff;font-size:.625rem;font-weight:700;padding:.125rem .5rem;border-radius:999px;margin-left:.375rem;">0</span>
        </button>
        <button id="btn-republish-requests" class="btn btn-ghost btn-sm" style="margin-left:.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="margin-right:.375rem;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m-15.357-2a8.001 8.001 0 0015.357 2m0 0H15"/></svg>
          Republicaciones <span id="republish-badge" class="hidden" style="background:var(--accent);color:#fff;font-size:.625rem;font-weight:700;padding:.125rem .5rem;border-radius:999px;margin-left:.375rem;">0</span>
        </button>
      </div>

      <!-- Buscador -->
      <div style="margin-bottom:1.25rem;">
        <input id="courses-search" class="form-input" type="search" placeholder="Buscar por título o profesor..." style="max-width:420px;" />
      </div>

      <!-- Tabs por estado -->
      <div style="border-bottom:1px solid var(--border);margin-bottom:1.5rem;display:flex;gap:.25rem;overflow-x:auto;">
        <button class="tab-btn active" data-tab="all">Todos</button>
        <button class="tab-btn" data-tab="published">Publicados</button>
        <button class="tab-btn" data-tab="pending">En revisión</button>
        <button class="tab-btn" data-tab="draft">Borradores</button>
        <button class="tab-btn" data-tab="rejected">Rechazados</button>
        <button class="tab-btn" data-tab="removed">Archivados</button>
        <button class="tab-btn" data-tab="reviews">Reseñas</button>
      </div>

      <div id="courses-loading" style="display:flex;justify-content:center;padding:4rem;"><div class="loader-spinner"></div></div>

      <div id="courses-list" class="hidden" style="display:flex;flex-direction:column;gap:1.25rem;"></div>

      <div id="courses-empty" class="hidden empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        <p>No hay cursos para mostrar.</p>
      </div>

      <!-- Panel: Reseñas -->
      <div id="reviews-panel" class="hidden">
        <div id="reviews-list" class="hidden" style="display:flex;flex-direction:column;gap:1rem;"></div>
        <div id="reviews-empty" class="hidden empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
          <p>No hay reseñas para mostrar.</p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal rechazo curso -->
<div id="modal-reject" class="hidden" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div class="card" style="width:100%;max-width:480px;padding:2rem;">
    <h3 style="margin-bottom:.5rem;">Rechazar curso</h3>
    <p id="reject-course-name" style="font-size:.875rem;color:var(--text-muted);margin-bottom:1.25rem;"></p>
    <label class="form-label">Motivo del rechazo *</label>
    <textarea id="reject-reason" class="form-input" rows="4" placeholder="Explicá al profesor por qué se rechaza el curso..." style="resize:vertical;margin-bottom:1.25rem;"></textarea>
    <div style="display:flex;gap:.75rem;justify-content:flex-end;">
      <button id="btn-cancel-reject" class="btn btn-ghost">Cancelar</button>
      <button id="btn-confirm-reject" class="btn btn-error">Confirmar rechazo</button>
    </div>
  </div>
</div>

<!-- Modal solicitudes de eliminación -->
<div id="modal-requests" class="hidden" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div class="card" style="width:100%;max-width:640px;padding:2rem;max-height:80vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <h3 style="font-size:1rem;">Solicitudes de eliminación</h3>
      <button id="btn-close-requests" class="btn btn-ghost btn-sm">Cerrar</button>
    </div>
    <div id="requests-list" style="overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;"></div>
  </div>
</div>

<!-- Modal solicitudes de republicación -->
<div id="modal-republish" class="hidden" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;">
  <div class="card" style="width:100%;max-width:640px;padding:2rem;max-height:80vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <h3 style="font-size:1rem;">Solicitudes de republicación</h3>
      <button id="btn-close-republish" class="btn btn-ghost btn-sm">Cerrar</button>
    </div>
    <div id="republish-list" style="overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;"></div>
  </div>
</div>

<script type="module" src="../../assets/js/app.js"></script>
<script type="module" src="../../assets/js/admin-utils.js"></script>
<script type="module" src="../../assets/js/admin-courses.js"></script>
<script type="module" src="../../assets/js/spa.js"></script>
</body>
</html>
