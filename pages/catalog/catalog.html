<!DOCTYPE html>
<!-- File: plataforma cursos SyM/pages/catalog/catalog.html -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de cursos — Cursos SyM</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    /* ── Barra de búsqueda sticky ── */
    .catalog-search-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-primary);
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .catalog-search-inner {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: .5rem 1rem;
      transition: border-color var(--transition);
    }
    .catalog-search-inner:focus-within { border-color: var(--accent); }
    .catalog-search-inner input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: .9375rem;
      outline: none;
    }
    .catalog-search-inner input::placeholder { color: var(--text-muted); }

    /* ── Filtros horizontales ── */
    .catalog-filters-bar {
      padding: .625rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .filter-scroll {
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: .125rem;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .375rem .875rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: .8125rem;
      cursor: pointer;
      background: none;
      color: var(--text-secondary);
      transition: all var(--transition);
      white-space: nowrap;
    }
    .filter-chip:hover  { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); font-weight: 600; }

    /* Fila de controles: precio + ordenar + limpiar */
    .filter-controls {
      display: flex;
      align-items: center;
      gap: .5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-controls::-webkit-scrollbar { display: none; }
    .filter-select {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-primary);
      padding: .375rem .875rem;
      font-size: .8125rem;
      cursor: pointer;
      outline: none;
    }

    /* ── Resultados ── */
    .catalog-results {
      padding: .75rem 1rem 4rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .75rem;
      flex-wrap: wrap;
      gap: .375rem;
    }

    /* ── Grid ── */
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .75rem;
    }
    @media (min-width: 640px)  { .courses-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .courses-grid { grid-template-columns: repeat(4, 1fr); gap: 1.25rem; } }

    /* ── Tarjeta ── */
    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }
    .course-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-accent); }
    .course-card-thumb {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--bg-secondary);
    }
    .course-card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .course-card-body {
      padding: .625rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }
    .course-card-cat  { font-size: .625rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .course-card-title { font-size: .8125rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .course-card-teacher { font-size: .6875rem; color: var(--text-muted); }
    .course-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: .375rem; }
    .course-card-price { font-size: .8125rem; font-weight: 700; }
    .course-card-price.free { color: var(--success); }
    .course-card-stars { font-size: .625rem; color: var(--warning); }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Chips activos ── */
    #active-filters { display: flex; flex-wrap: wrap; gap: .375rem; margin-bottom: .5rem; }
  </style>
</head>
<body>

<div class="main-content">

  <!-- ─── Barra de búsqueda sticky ─────────────────────────── -->
  <div class="catalog-search-bar">
    <div class="catalog-search-inner">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);flex-shrink:0;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      <input id="search-input" type="text" placeholder="Buscar cursos, profesores..." />
      <button id="btn-clear-search" class="btn btn-ghost btn-sm" style="padding:.25rem;display:none;" aria-label="Limpiar búsqueda">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- ─── Filtros horizontales ─────────────────────────────── -->
  <div class="catalog-filters-bar">
    <!-- Categorías -->
    <div class="filter-scroll" id="category-filters">
      <button class="filter-chip active" data-category="">Todas</button>
    </div>
    <!-- Precio + Ordenar + Limpiar -->
    <div class="filter-controls">
      <select id="price-select" class="filter-select">
        <option value="all">Todos</option>
        <option value="free">Gratis</option>
        <option value="paid">De pago</option>
      </select>
      <select id="sort-select" class="filter-select">
        <option value="newest">Recientes</option>
        <option value="rating">Mejor rating</option>
        <option value="students">Más alumnos</option>
        <option value="price-asc">↑ Precio</option>
        <option value="price-desc">↓ Precio</option>
      </select>
      <!-- Tags -->
      <div class="filter-scroll" id="tag-filters" style="flex:1;"></div>
      <button id="btn-clear-filters" class="filter-chip" style="border-color:var(--error);color:var(--error);flex-shrink:0;">Limpiar</button>
    </div>
  </div>

  <!-- ─── Resultados ───────────────────────────────────────── -->
  <div class="catalog-results">

    <!-- Meta + chips activos -->
    <div class="results-meta">
      <p id="results-count" style="font-size:.8125rem;color:var(--text-muted);"></p>
    </div>
    <div id="active-filters"></div>

    <!-- Skeletons -->
    <div id="catalog-loading" class="courses-grid">
      ${Array(6).fill(`
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;">
          <div class="skeleton" style="width:100%;aspect-ratio:4/3;"></div>
          <div style="padding:.625rem;">
            <div class="skeleton" style="height:10px;width:50%;margin-bottom:.5rem;"></div>
            <div class="skeleton" style="height:13px;width:90%;margin-bottom:.375rem;"></div>
            <div class="skeleton" style="height:13px;width:70%;margin-bottom:.75rem;"></div>
            <div class="skeleton" style="height:16px;width:40%;"></div>
          </div>
        </div>`).join('')}
    </div>

    <!-- Grid de cursos -->
    <div id="courses-grid" class="courses-grid hidden"></div>

    <!-- Sin resultados -->
    <div id="no-results" class="hidden empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      <p>No encontramos cursos con esos filtros.</p>
      <button id="btn-reset-empty" class="btn btn-primary" style="margin-top:1rem;">Ver todos los cursos</button>
    </div>

  </div>
</div>

<!-- Inputs radio ocultos para compatibilidad con catalog.js -->
<div style="display:none;">
  <input type="radio" name="price" value="all" checked />
  <input type="radio" name="price" value="free" />
  <input type="radio" name="price" value="paid" />
</div>

<script type="module" src="../../assets/js/app.js"></script>
<script type="module" src="../../assets/js/spa.js"></script>
<script type="module">
  // Puente: price-select → radio oculto (para que catalog.js funcione sin cambios)
  document.getElementById('price-select').addEventListener('change', (e) => {
    const radio = document.querySelector(`input[name="price"][value="${e.target.value}"]`);
    if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change', { bubbles: true })); }
  });
  // Botón limpiar búsqueda
  const searchInput = document.getElementById('search-input');
  const clearBtn    = document.getElementById('btn-clear-search');
  searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'flex' : 'none';
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    searchInput.dispatchEvent(new Event('input'));
    searchInput.focus();
  });
</script>
<script type="module" src="../../assets/js/catalog.js"></script>

</body>
</html>
